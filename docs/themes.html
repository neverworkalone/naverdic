<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네이버 영어사전 크롬 확장프로그램의 팝업 색상과 글자 크기를 설정하는 방법입니다.">
  <title>추천 테마 | 네이버 영어사전</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="document">
    <nav class="document-nav"><a href="index.html">← 도움말</a><a href="deepl.html">DeepL 설정 →</a></nav>
    <article>
      <header class="document-header">
        <p class="eyebrow">네이버 영어사전 크롬 확장프로그램</p>
        <h1>네이버 사전<br>추천 테마</h1>
        <img class="product-image" src="assets/extension-logo.png" width="180" height="180"
             alt="네이버 영어사전 크롬 확장프로그램 로고">
      </header>

      <div class="content">
        <p>NaverDic 7.0에서는 설정 페이지의 모양 메뉴에서 팝업의 배경색, 글자색, 글자 크기를 취향에 맞게 바꿀 수 있습니다.</p>
        <figure class="theme-example">
          <img src="assets/theme-settings.png" width="827" height="498" alt="네이버 영어사전 v7.0 모양 설정 화면">
        </figure>
        <p>기본색이 질리신 분들을 위해 몇 가지 샘플 테마를 소개해 드리니 입맛에 맞게 골라 사용해 보세요. 이미지 아래의 색상 코드를 드래그해 복사한 뒤 팝업 배경색 입력란에 넣어주면 됩니다.</p>
        <figure class="theme-example">
          <img src="assets/theme1.png" width="541" height="286" alt="붉은색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="붉은색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#E57373">#E57373</mark><mark class="theme-color-code" style="background-color:#F06292">#F06292</mark><mark class="theme-color-code" style="background-color:#FFF59D">#FFF59D</mark>
          </figcaption>
        </figure>
        <figure class="theme-example">
          <img src="assets/theme2.png" width="541" height="281" alt="보라색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="보라색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#CE93D8">#CE93D8</mark><mark class="theme-color-code" style="background-color:#B39DDB">#B39DDB</mark><mark class="theme-color-code" style="background-color:#9FA8DA">#9FA8DA</mark>
          </figcaption>
        </figure>
        <figure class="theme-example">
          <img src="assets/theme3.png" width="541" height="269" alt="푸른색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="푸른색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#90CAF9">#90CAF9</mark><mark class="theme-color-code" style="background-color:#4FC3F7">#4FC3F7</mark><mark class="theme-color-code" style="background-color:#4DD0E1">#4DD0E1</mark>
          </figcaption>
        </figure>
        <figure class="theme-example">
          <img src="assets/theme4.png" width="541" height="274" alt="초록색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="초록색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#4DB6AC">#4DB6AC</mark><mark class="theme-color-code" style="background-color:#66BB6A">#66BB6A</mark><mark class="theme-color-code" style="background-color:#9CCC65">#9CCC65</mark>
          </figcaption>
        </figure>
        <figure class="theme-example">
          <img src="assets/theme5.png" width="541" height="273" alt="주황색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="주황색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#FFA726">#FFA726</mark><mark class="theme-color-code" style="background-color:#FF9E80">#FF9E80</mark><mark class="theme-color-code" style="background-color:#FFC107">#FFC107</mark>
          </figcaption>
        </figure>
        <figure class="theme-example">
          <img src="assets/theme6.png" width="541" height="268" alt="회색 계열의 네이버 사전 팝업 테마" loading="lazy">
          <figcaption class="theme-codes" aria-label="회색 계열 배경색 코드">
            <span>배경색</span><mark class="theme-color-code" style="background-color:#A1887F">#A1887F</mark><mark class="theme-color-code" style="background-color:#90A4AE">#90A4AE</mark><mark class="theme-color-code" style="background-color:#9E9E9E">#9E9E9E</mark>
          </figcaption>
        </figure>
        <p class="store-link"><a href="https://chrome.google.com/webstore/detail/%EB%84%A4%EC%9D%B4%EB%B2%84-%EC%98%81%EC%96%B4%EC%82%AC%EC%A0%84-naver-dictionary/imnbhbjodhdinfaifjbpgkpknejadfjk" target="_blank" rel="noopener noreferrer">Chrome 웹 스토어에서 네이버 영어사전 열기</a></p>
      </div>
    </article>
  </main>
</body>
</html>
